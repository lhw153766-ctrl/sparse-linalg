name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check / build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One platform failing must not cancel the others, otherwise a Windows
      # only breakage hides the Linux result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL -o /tmp/moonbit-install.sh https://cli.moonbitlang.com/install/unix.sh; then
              bash /tmp/moonbit-install.sh && break
            fi
            echo "install attempt ${attempt} failed, retrying"
            sleep 5
          done
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ok = $false
          foreach ($attempt in 1..3) {
            try {
              Invoke-WebRequest -Uri https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:TEMP\moonbit-install.ps1"
              & "$env:TEMP\moonbit-install.ps1"
              $ok = $true
              break
            } catch {
              Write-Host "install attempt $attempt failed: $_"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) { throw "MoonBit install failed after 3 attempts" }
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Refresh the package index
        shell: bash
        run: |
          moon version --all
          # Without this, `moon check` cannot resolve dependencies even though
          # `moon fmt --check` still passes, which is easy to misread as green.
          moon update

      - name: moon check
        shell: bash
        run: |
          moon check --target all

      - name: moon build
        shell: bash
        run: |
          moon build --target all

      - name: moon test
        shell: bash
        run: |
          moon test --target all

      - name: Formatting
        shell: bash
        run: |
          moon fmt --check
